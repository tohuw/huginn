name: CI

# Manual-only: the CI floor runs locally on pre-push (.githooks/pre-push) so no
# metered Actions minutes are spent on every push/PR (this matrix is macOS +
# Windows, the expensive 10x/2x multipliers). Trigger this by hand when you want
# the full cross-OS matrix — e.g. before a release or after touching anything
# portability-sensitive (LaunchAgent, iTerm focus, the Windows paths in
# huginn/platform/windows.py).
#
# There is no tray build step any more: the .NET tray shell and the Swift
# menu-bar app were removed in favour of Roost, which is a separate repository
# with its own CI. Nothing in this workflow needs a dotnet or swiftc toolchain.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    # macOS remains the primary regression target for LaunchAgent and iTerm focus.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (fails clearly on lockfile drift)
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      # --all-packages: the workspace has two distributables since issue #42
      # (huginn + the shared corvidae package), and huginn's wheel now depends on
      # corvidae's, so both must be built for the smoke test below to resolve.
      - name: Build wheels
        run: uv build --all-packages

      - name: Install wheel into a clean venv and smoke-test
        run: |
          python3 -m venv /tmp/huginn-smoke-venv
          /tmp/huginn-smoke-venv/bin/pip install --quiet dist/*.whl
          /tmp/huginn-smoke-venv/bin/python -c "import corvidae; print('corvidae ok')"
          /tmp/huginn-smoke-venv/bin/python -c "import huginn; print('import ok')"
          /tmp/huginn-smoke-venv/bin/huginn --help
          /tmp/huginn-smoke-venv/bin/huginn status

  windows:
    name: windows (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Build wheels
        run: uv build --all-packages
