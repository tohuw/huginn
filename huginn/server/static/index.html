<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huginn</title>
<link rel="stylesheet" href="/static/style.css">
<link id="favicon" rel="icon" type="image/svg+xml" href="/static/bird.svg">
</head>
<body>
<header>
  <div class="brand"><img src="/static/bird.svg" alt="">Huginn</div>
  <div class="attention" id="attention-pill" hidden><span id="attention-n">0</span> need you</div>
  <div class="spacer"></div>
  <select id="view" class="ctl" title="Session view">
    <option value="cards">cards</option>
    <option value="list">list</option>
  </select>
  <select id="sort" class="ctl" title="Sort sessions" aria-label="Sort sessions">
    <option value="state">by state</option>
    <option value="alpha">by A–Z</option>
    <option value="newest">by newest</option>
    <option value="oldest">by oldest</option>
  </select>
  <label class="ctl" title="LLM blurbs on state change">
    <input type="checkbox" id="llm-toggle"> blurbs
  </label>
  <label class="ctl" title="Desktop presence tiles">
    <input type="checkbox" id="desktop-toggle"> apps
  </label>
  <select id="provider" class="ctl" title="Q&A provider">
    <option value="claude">claude</option>
    <option value="codex">codex</option>
  </select>
  <button id="chat-toggle" class="ctl">ask ▾</button>
  <button id="help" class="ctl" title="Open the interactive Huginn tour">help</button>
</header>

<main>
  <div id="grid"></div>
  <section id="app-tiles" hidden>
    <div class="section-label">desktop presence</div>
    <div id="app-grid"></div>
  </section>
  <div id="empty" hidden>
    <span id="roster-throbber" hidden></span>
    <span id="empty-label">no sessions</span>
  </div>
</main>

<aside id="chat">
  <div id="chat-resize" role="separator" aria-label="Resize Ask panel"></div>
  <div id="chat-bar">
    <span>ask</span>
    <button id="chat-span" type="button" title="Span Ask across the bottom"
      aria-label="Span Ask across the bottom"></button>
  </div>
  <div id="chat-log"></div>
  <form id="chat-form">
    <div class="chat-input-wrap">
      <textarea id="chat-input" rows="2" autocomplete="off"
        placeholder="ask about sessions… use @name"></textarea>
      <div id="mention-menu" role="listbox" hidden></div>
    </div>
    <button type="submit">→</button>
  </form>
</aside>

<template id="card-tpl">
  <div class="card">
    <div class="row1">
      <span class="src"></span><span class="name"></span>
      <span class="badge"></span><span class="dur"></span>
    </div>
    <div class="row2"><span class="cwd"></span><span class="branch"></span><span class="model"></span></div>
    <div class="card-title-row"><span class="card-title"></span><button class="edit-title"
      title="Edit card title" aria-label="Edit card title">✎</button></div>
    <div class="blurb"></div>
    <div class="subagents"></div>
    <pre class="peek" hidden></pre>
    <div class="actions">
      <button class="jump">jump</button>
      <button class="peek-btn">peek</button>
      <button class="ask">ask</button>
      <span class="tokens"></span>
    </div>
  </div>
</template>

<script src="/static/app.js"></script>
</body>
</html>
