name: CI

# Runs on pushes to the default branch and on PRs, matching Muninn and Roost.
#
# It was manual-only to save metered Actions minutes (this matrix is macOS +
# Windows, the expensive 10x/2x multipliers), on the reasoning that the local
# pre-push hook is the CI floor. That reasoning had a hole: the hook runs on one
# developer's OS, so the *other* platforms were only ever checked when someone
# remembered to press the button. Three macOS regressions and a Windows suite
# that aborted mid-run all shipped through that gap. Cross-platform breakage is
# precisely what this matrix exists to catch, and it cannot catch it on request.
#
# Scoped to the default branch rather than every branch, and dispatchable still,
# to keep the bill honest.
#
# There is no tray build step any more: the .NET tray shell and the Swift
# menu-bar app were removed in favour of Roost, which is a separate repository
# with its own CI. Nothing in this workflow needs a dotnet or swiftc toolchain.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    # macOS remains the primary regression target for LaunchAgent and iTerm focus.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (fails clearly on lockfile drift)
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      # --all-packages: the workspace has two distributables since issue #42
      # (huginn + the shared corvidae package), and huginn's wheel now depends on
      # corvidae's, so both must be built for the smoke test below to resolve.
      - name: Build wheels
        run: uv build --all-packages

      - name: Install wheel into a clean venv and smoke-test
        run: |
          python3 -m venv /tmp/huginn-smoke-venv
          /tmp/huginn-smoke-venv/bin/pip install --quiet dist/*.whl
          /tmp/huginn-smoke-venv/bin/python -c "import corvidae; print('corvidae ok')"
          /tmp/huginn-smoke-venv/bin/python -c "import huginn; print('import ok')"
          /tmp/huginn-smoke-venv/bin/huginn --help
          /tmp/huginn-smoke-venv/bin/huginn status

  windows:
    name: windows (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Build wheels
        run: uv build --all-packages
