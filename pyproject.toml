[project]
name = "huginn"
version = "2026.08.16.5"
description = "Local monitor for AI coding-agent sessions (Claude Code, Codex, Claude Desktop)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # Shared, independently versioned internals (transcript tailing, credential
    # redaction, session shapes, start-at-login supervision, raven descriptors)
    # with a declared stability contract -- issue #42. Pinned to the CalVer year
    # corvidae promises compatibility within; see packages/corvidae/README.md.
    # The floor is 2026.8.1 because agent_install and raven now import
    # corvidae.login_agent/descriptor/label, which 2026.7.31 does not have.
    "corvidae>=2026.8.1,<2027",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "watchfiles>=0.24",
]

[project.scripts]
huginn = "huginn.cli:main"
huginn-hook = "huginn.hooks.cli:main"

# The same forwarder, built against the GUI subsystem. Hooks fire on every
# prompt and every stop, and a console-subsystem executable launched without a
# console to inherit makes Windows allocate one -- which on Windows 11 means
# Windows Terminal opens and closes a window each time. See WINDOWS.md.
[project.gui-scripts]
huginn-hookw = "huginn.hooks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["huginn"]

# corvidae lives in this repo as a separate distributable so Muninn can depend on
# it without depending on Huginn -- issue #42. A uv workspace means local dev and
# CI resolve it from the checkout, while the published dependency above stays an
# ordinary version range.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
corvidae = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
# Two test trees since issue #42: huginn's own, plus the shared package's, which
# lives with its code. Listed explicitly so `uv run pytest -q` at the repo root
# stays the single command that gates a push (.githooks/pre-push) -- an implicit
# rootdir walk would silently stop covering corvidae if the layout moved.
testpaths = ["tests", "packages/corvidae/tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# Small, intentional set (issue #21): pyflakes + pycodestyle, not the full
# default ruleset -- this codebase deliberately uses semicolon one-liners
# (E702) and doesn't wrap to 79/88 cols, so those are excluded rather than
# reformatted to match a style the project never adopted.
select = ["E", "F", "W"]
ignore = ["E702"]
