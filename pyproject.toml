[project]
name = "huginn"
version = "2026.07.28.1"
description = "Local monitor for AI coding-agent sessions (Claude Code, Codex, Claude Desktop)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "watchfiles>=0.24",
]

[project.scripts]
huginn = "huginn.cli:main"
huginn-hook = "huginn.hooks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["huginn"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# Small, intentional set (issue #21): pyflakes + pycodestyle, not the full
# default ruleset -- this codebase deliberately uses semicolon one-liners
# (E702) and doesn't wrap to 79/88 cols, so those are excluded rather than
# reformatted to match a style the project never adopted.
select = ["E", "F", "W"]
ignore = ["E702"]
